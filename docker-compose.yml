services:
  tts-webui:
    image: "ghcr.io/rsxdalv/tts-webui:main"
    restart: unless-stopped
    # Published on loopback only. These services have no authentication by
    # default, so binding them to every host interface exposes them to the
    # local network. Override BIND_HOST=0.0.0.0 if you intend that.
    ports:
      # One port: the React UI is at / and the Gradio pages are under /gradio-legacy/
      - ${BIND_HOST:-127.0.0.1}:${TTS_PORT:-7770}:7770
      - ${BIND_HOST:-127.0.0.1}:${OPENAI_API_PORT:-7778}:7778
    container_name: tts-webui
    # The app runs as uid 1000 (appuser), not as root. Files that an older image created as root in
    # these folders are handed to appuser on the first start. A folder that belongs to another user
    # has to be writable for uid 1000 (chown 1000:1000 ./data), or set TTS_WEBUI_RUN_AS_ROOT=1 below.
    volumes:
      - ./data:/app/tts-webui/data
      - ./outputs:/app/tts-webui/outputs
      - ./favorites:/app/tts-webui/favorites
      # - ./voices:/app/tts-webui/voices
    environment:
      # The React UI is served on the public port, and its Host check accepts only this machine's own addresses
      # unless LAN mode is on (D17, D20). It is on here, with these names: add the name or address you open the UI
      # with, e.g. TTS_ALLOWED_HOSTS=localhost,127.0.0.1,my-server
      TTS_GO_PROXY_LISTEN: lan
      TTS_GO_PROXY_ALLOWED_HOSTS: ${TTS_ALLOWED_HOSTS:-localhost,127.0.0.1}
      # Run as root, as the image did before (see the note above the volumes):
      # TTS_WEBUI_RUN_AS_ROOT: 1
    # Optional:
    #   # Disable hard requirements for CUDA version ("requirement error: unsatisfied condition [...]")
    #   # This might still lead to errors but allows to run some models even if CUDA version is not met
    #   # https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/docker-specialized.html#nvidia-disable-require-environment-variable
    #   NVIDIA_DISABLE_REQUIRE: 1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  # SQLite is used as the database - no separate container needed
  # Database files are stored in ./data/sqlite/
