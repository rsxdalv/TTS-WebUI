name: Core (Go)

on:
  push:
    paths:
      - "core/**"
      - "core/ui/**"
      - ".github/workflows/core.yaml"
  pull_request:
    paths:
      - "core/**"
      - "core/ui/**"
      - ".github/workflows/core.yaml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: go test -race
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: ".exe" }
          - { goos: windows, goarch: arm64, ext: ".exe" }
          - { goos: linux, goarch: amd64, ext: "" }
          - { goos: linux, goarch: arm64, ext: "" }
          - { goos: darwin, goarch: amd64, ext: "" }
          - { goos: darwin, goarch: arm64, ext: "" }
    defaults:
      run:
        working-directory: core
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.mod
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath \
            -ldflags "-s -w \
              -X github.com/rsxdalv/TTS-WebUI/core/internal/version.Version=${{ github.ref_name }} \
              -X github.com/rsxdalv/TTS-WebUI/core/internal/version.Commit=${{ github.sha }} \
              -X github.com/rsxdalv/TTS-WebUI/core/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/tts-webui-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} \
            ./cmd/tts-webui
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tts-webui-${{ matrix.goos }}-${{ matrix.goarch }}
          path: core/dist/tts-webui-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          if-no-files-found: error

  build-webui:
    name: Build core UI and check committed assets
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: core/ui/package-lock.json
      - name: Build core entry
        run: bash core/scripts/build-webui.sh
      - name: Check committed assets match fresh build
        run: |
          # build-webui.sh above wiped core/internal/webui/assets and rebuilt it
          # (index.html, assets/*, bundle.hash). Any difference from what is
          # committed -- a changed file, a missing file, or a leftover/untracked
          # one -- means the committed bundle is stale for these sources.
          if [ -n "$(git status --porcelain --untracked-files=all -- core/internal/webui/assets)" ]; then
            echo "ERROR: committed core/internal/webui/assets differ from a fresh build."
            echo "Run 'bash core/scripts/build-webui.sh' (Node >= 22) and commit the result."
            git status --short --untracked-files=all -- core/internal/webui/assets
            git --no-pager diff --stat -- core/internal/webui/assets
            exit 1
          fi
          echo "Committed assets match a fresh build."
