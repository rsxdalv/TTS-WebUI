name: Build launcher exe (manual)

# Builds the Go launcher as a single Windows exe and uploads it as a workflow
# artifact. Nothing is released or published.
#
# The push trigger exists only so GitHub registers this workflow from the
# core/rings-1-2 branch (workflow_dispatch needs the file on the default branch).
on:
  workflow_dispatch:
  push:
    branches:
      - core/rings-1-2
    paths:
      - ".github/workflows/build-launcher-exe.yaml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: core/ui/package-lock.json

      - name: Build embedded launcher UI
        run: bash core/scripts/build-webui.sh

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.mod

      - name: go vet
        working-directory: core
        run: go vet ./...

      - name: go test
        working-directory: core
        run: go test ./...

      - name: Build windows/amd64 exe
        working-directory: core
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w \
              -X github.com/rsxdalv/TTS-WebUI/core/internal/version.Version=${{ github.ref_name }} \
              -X github.com/rsxdalv/TTS-WebUI/core/internal/version.Commit=${{ github.sha }} \
              -X github.com/rsxdalv/TTS-WebUI/core/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/tts-webui.exe \
            ./cmd/tts-webui
          sha256sum dist/tts-webui.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tts-webui-windows-amd64
          path: core/dist/tts-webui.exe
          if-no-files-found: error
