name: Test default install (gradio-host)

# The default install has no micromamba and no shared env: the launcher installs uv, the
# pinned Python and the app's requirements into .venvs/gradio-host. This job does what the
# Extensions page does for the Gradio host, on the three OSes. The
# install needs nothing from the runner but the launcher (Go builds that only).

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-14, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod

      - name: Build the launcher
        shell: bash
        working-directory: core
        run: CGO_ENABLED=0 go build -trimpath -o ../tts-webui-ci ./cmd/tts-webui

      - name: Install gradio-host through the launcher
        shell: bash
        run: |
          bash core/scripts/ci/install-host.sh "$PWD/tts-webui-ci" "$PWD"

      - name: Upload launcher log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: install-host-${{ matrix.platform }}
          path: |
            install-host.launcher.log
            install-host.out
            installer_scripts/logs
