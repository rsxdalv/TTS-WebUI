[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "tts-webui-sdk"
version = "0.1.0"
description = "SDK helpers for TTS WebUI extensions and engine authors"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
]

[project.optional-dependencies]
torch = ["torch"]

[tool.setuptools.packages.find]
where = ["src"]
