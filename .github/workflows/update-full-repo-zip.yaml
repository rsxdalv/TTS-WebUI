name: Update Full Repository Zip

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  update-zip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0 # This ensures we get the full git history
          # Do not write the job token into .git/config: the archive carries .git and is
          # published. Nothing after this step needs git credentials (the release steps
          # pass secrets.GITHUB_TOKEN to the GitHub API themselves).
          persist-credentials: false

      - name: Clear git settings
        run: |
          # Remove the [gc] section
          git config --unset gc.auto || true
          
          # Remove the [http "https://github.com/"] section
          git config --unset-all http.https://github.com/.extraheader || true
          
          # Verify the changes
          git config --list

          # Stop file mode changes from being included in the zip
          # git config core.fileMode false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.mod

      - name: Build the launcher for every platform into the repository root
        # start_app.bat/.sh and root.sh run these; the launcher page is embedded
        # in the binary (core/internal/webui/assets is committed).
        working-directory: core
        env:
          CGO_ENABLED: "0"
        run: |
          LDFLAGS="-s -w             -X github.com/rsxdalv/TTS-WebUI/core/internal/version.Version=main             -X github.com/rsxdalv/TTS-WebUI/core/internal/version.Commit=${GITHUB_SHA}             -X github.com/rsxdalv/TTS-WebUI/core/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          build() { # os arch output
            GOOS=$1 GOARCH=$2 go build -trimpath -ldflags "$LDFLAGS" -o "../$3" ./cmd/tts-webui
          }
          build windows amd64 tts-webui.exe
          build linux amd64 tts-webui-linux-amd64
          build linux arm64 tts-webui-linux-arm64
          build darwin arm64 tts-webui-macos-arm64
          build darwin amd64 tts-webui-macos-amd64
          ls -l ../tts-webui*

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the React UI export (frontend/out)
        # D32: the archive ships the export, so a new install needs no Node. build-static.js
        # records this checkout's commit in out/_tts-export.json; the archive carries the
        # same checkout's .git, so the launcher does not call the export stale.
        working-directory: frontend
        run: |
          npm install
          npm run build:static
          test -f out/_tts-export.json

      - name: Describe the archive (archive.json)
        # archive.json is in the zip and published beside it as tts-webui-installer.json:
        # the launcher compares the two to tell whether an update is waiting (no git needed).
        run: |
          printf '{"commit":"%s","built":"%s"}\n' "$(git rev-parse HEAD)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > archive.json
          cat archive.json
          cp archive.json tts-webui-installer.json

      - name: Refuse to publish credentials in .git
        run: |
          set -eu
          # The archive carries .git (the launcher updates with `git pull`, which needs
          # the origin remote in .git/config), and it is published. Fail the job, rather
          # than publish, if anything the job authenticated with is in there.
          bad=0
          if git config --local --list | grep -qiE 'extraheader|authorization|x-access-token|ghs_|ghp_|github_pat_|includeif'; then
            echo "::error::.git/config carries credentials or a credential include"
            bad=1
          fi
          # Everything of .git except the object store (binary, and content is public).
          if grep -rIlE -i 'x-access-token|authorization: *(basic|bearer)|ghs_[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}' --exclude-dir=objects .git; then
            echo "::error::a credential is in the .git folder that goes into the archive"
            bad=1
          fi
          [ "$bad" = 0 ] || exit 1
          echo "No credentials in .git"

      - name: Create zip file with full git history
        run: |
          # The repository including .git (with .git/config: the launcher updates with
          # git pull, which needs the origin remote), the launchers, frontend/out and
          # archive.json.
          # Not the Node dependencies of the build, nor the published copy of archive.json.
          zip -r tts-webui-installer.zip . -x "frontend/node_modules/*" "tts-webui-installer.json"

      - name: Delete existing asset if it exists
        uses: actions/github-script@v6
        continue-on-error: true
        with:
          script: |
            // Get the latest release
            // const { data: release } = await github.rest.repos.getLatestRelease({
            //  owner: context.repo.owner,
            //  repo: context.repo.repo
            // });

            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: 'v0.0.0'
            });

            const assets = release.assets;
            const assetNames = ['tts-webui-installer.zip', 'tts-webui-installer.json'];

            for (const asset of assets) {
              if (assetNames.includes(asset.name)) {
                console.log(`Deleting existing asset: ${asset.name} (${asset.id})`);
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id
                });
              }
            }
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ZIP to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tts-webui-installer.zip
            tts-webui-installer.json
          tag_name: v0.0.0
          token: ${{ secrets.GITHUB_TOKEN }}